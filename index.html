<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Pop Motivation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #4a4a4a;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        #time-display {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #4a4a4a;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 20;
            color: white;
            text-align: center;
        }
        
        #game-over-screen {
            display: none;
        }
        
        .title {
            font-size: 42px;
            margin-bottom: 20px;
            color: #ffd166;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            max-width: 80%;
            line-height: 1.4;
        }
        
        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            pointer-events: auto;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }
        
        .btn:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .final-score {
            font-size: 36px;
            margin: 20px 0;
            color: #ffd166;
        }
        
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.1) 60%);
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 5;
        }
        
        .bubble:active {
            transform: scale(0.95);
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }
        
        .quote {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            width: 200px;
            opacity: 0;
            animation: floatUp 2s forwards;
            pointer-events: none;
            z-index: 6;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px);
                opacity: 0;
            }
        }
        
        @media (max-width: 600px) {
            .title {
                font-size: 32px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .btn {
                padding: 10px 25px;
                font-size: 16px;
            }
            
            .quote {
                font-size: 16px;
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Bubbles will be generated here -->
    </div>
    
    <div id="ui-container">
        <div id="score-display">Score: 0</div>
        <div id="time-display">Time: 60</div>
    </div>
    
    <div id="start-screen">
        <h1 class="title">Motivational Bubble Pop!</h1>
        <p class="subtitle">Pop bubbles for motivational quotes! Tap to pop, swipe to move them. Score points in 60 seconds!</p>
        <button id="start-btn" class="btn">Start Game</button>
    </div>
    
    <div id="game-over-screen">
        <h1 class="title">Game Over!</h1>
        <div class="final-score">Score: <span id="final-score">0</span></div>
        <button id="restart-btn" class="btn">Play Again</button>
    </div>

    <script type="module">
        // Game configuration
        const config = {
            gameDuration: 60, // seconds
            bubbleSpawnRate: 1000, // milliseconds
            maxBubbles: 15,
            minBubbleSize: 40,
            maxBubbleSize: 100,
            swipeThreshold: 10, // pixels
            colors: [
                '#ff6b6b', '#ff9e7d', '#ffd166', '#06d6a0', 
                '#118ab2', '#073b4c', '#7209b7', '#f72585'
            ],
            points: {
                small: 10,
                medium: 5,
                large: 2
            },
            quotes: [
                "You've got this!",
                "Believe in yourself!",
                "Small steps lead to big results!",
                "You're doing amazing!",
                "Keep going!",
                "Success is a series of small wins!",
                "You're stronger than you think!",
                "Progress, not perfection!",
                "Every bubble popped is progress!",
                "You're unstoppable!",
                "Make it happen!",
                "You're capable of amazing things!",
                "Don't stop now!",
                "Great job!",
                "You're on fire!",
                "Persistence pays off!",
                "You're making waves!",
                "Keep that momentum!",
                "You're crushing it!",
                "The only limit is you!"
            ]
        };
        
        // Game state
        let score = 0;
        let timeLeft = config.gameDuration;
        let gameActive = false;
        let bubbles = [];
        let particles = [];
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        let gameInterval;
        let bubbleInterval;
        let timeInterval;
        
        // Audio elements
        const popSounds = [
            new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...'), // Short pop sound
            new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...'), // Different pop
            new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...')  // Another pop
        ];
        
        // DOM elements
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        // Initialize game
        function init() {
            // Event listeners
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
            
            // Touch/mouse event listeners
            gameContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
            gameContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
            gameContainer.addEventListener('touchend', handleTouchEnd);
            
            gameContainer.addEventListener('mousedown', handleMouseDown);
            gameContainer.addEventListener('mousemove', handleMouseMove);
            gameContainer.addEventListener('mouseup', handleMouseUp);
            
            // Preload sounds
            preloadSounds();
            
            // Initial render
            render();
        }
        
        // Preload sound effects
        function preloadSounds() {
            popSounds.forEach(sound => {
                sound.volume = 0.3;
                sound.load();
            });
        }
        
        // Play random pop sound
        function playPopSound() {
            const randomSound = popSounds[Math.floor(Math.random() * popSounds.length)];
            randomSound.currentTime = 0;
            randomSound.play().catch(e => console.log("Audio play failed:", e));
        }
        
        // Start the game
        function startGame() {
            // Reset game state
            score = 0;
            timeLeft = config.gameDuration;
            bubbles = [];
            particles = [];
            
            // Update UI
            scoreDisplay.textContent = `Score: ${score}`;
            timeDisplay.textContent = `Time: ${timeLeft}`;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Clear any existing game elements
            gameContainer.innerHTML = '';
            
            // Start game loops
            gameActive = true;
            
            // Spawn initial bubbles
            spawnBubbles(5);
            
            // Set up intervals
            bubbleInterval = setInterval(spawnRandomBubble, config.bubbleSpawnRate);
            timeInterval = setInterval(updateTimer, 1000);
            
            // Start game loop
            gameInterval = requestAnimationFrame(gameLoop);
        }
        
        // End the game
        function endGame() {
            gameActive = false;
            
            // Clear intervals
            clearInterval(bubbleInterval);
            clearInterval(timeInterval);
            cancelAnimationFrame(gameInterval);
            
            // Show game over screen
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Game loop
        function gameLoop() {
            if (!gameActive) return;
            
            update();
            render();
            
            gameInterval = requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function update() {
            // Update particles
            updateParticles();
            
            // Update bubbles
            updateBubbles();
        }
        
        // Render game elements
        function render() {
            // Bubbles are rendered as DOM elements, so no need to redraw here
        }
        
        // Spawn initial bubbles
        function spawnBubbles(count) {
            for (let i = 0; i < count; i++) {
                spawnBubble();
            }
        }
        
        // Spawn a random bubble
        function spawnRandomBubble() {
            if (bubbles.length < config.maxBubbles && gameActive) {
                spawnBubble();
            }
        }
        
        // Spawn a single bubble
        function spawnBubble() {
            const size = randomInt(config.minBubbleSize, config.maxBubbleSize);
            const color = config.colors[randomInt(0, config.colors.length - 1)];
            
            // Calculate position ensuring bubble stays within viewport
            const maxX = window.innerWidth - size;
            const maxY = window.innerHeight - size;
            const x = randomInt(0, maxX);
            const y = randomInt(0, maxY);
            
            // Create bubble element
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
            bubble.style.backgroundColor = color;
            
            // Store bubble data
            const bubbleData = {
                element: bubble,
                x,
                y,
                size,
                color,
                vx: randomFloat(-1, 1),
                vy: randomFloat(-1, 1),
                popped: false
            };
            
            // Add to DOM and array
            gameContainer.appendChild(bubble);
            bubbles.push(bubbleData);
            
            // Add click/tap event
            bubble.addEventListener('click', () => popBubble(bubbleData));
            bubble.addEventListener('touchend', (e) => {
                if (!isSwiping) {
                    popBubble(bubbleData);
                }
                isSwiping = false;
            }, { passive: true });
        }
        
        // Update all bubbles
        function updateBubbles() {
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const bubble = bubbles[i];
                
                if (bubble.popped) {
                    // Remove popped bubbles
                    bubble.element.remove();
                    bubbles.splice(i, 1);
                    continue;
                }
                
                // Apply velocity
                bubble.x += bubble.vx;
                bubble.y += bubble.vy;
                
                // Bounce off walls
                if (bubble.x <= 0 || bubble.x >= window.innerWidth - bubble.size) {
                    bubble.vx *= -0.8; // Reverse and dampen
                }
                
                if (bubble.y <= 0 || bubble.y >= window.innerHeight - bubble.size) {
                    bubble.vy *= -0.8; // Reverse and dampen
                }
                
                // Apply friction
                bubble.vx *= 0.99;
                bubble.vy *= 0.99;
                
                // Update position
                bubble.element.style.left = `${Math.max(0, Math.min(window.innerWidth - bubble.size, bubble.x))}px`;
                bubble.element.style.top = `${Math.max(0, Math.min(window.innerHeight - bubble.size, bubble.y))}px`;
            }
        }
        
        // Pop a bubble
        function popBubble(bubble) {
            if (bubble.popped) return;
            
            bubble.popped = true;
            
            // Calculate points based on size
            let points;
            if (bubble.size < 60) {
                points = config.points.small;
            } else if (bubble.size < 90) {
                points = config.points.medium;
            } else {
                points = config.points.large;
            }
            
            // Update score
            score += points;
            scoreDisplay.textContent = `Score: ${score}`;
            
            // Create particles
            createParticles(bubble);
            
            // Show motivational quote
            showMotivationalQuote(bubble.x + bubble.size/2, bubble.y + bubble.size/2);
            
            // Play pop sound
            playPopSound();
        }
        
        // Show motivational quote
        function showMotivationalQuote(x, y) {
            const quote = document.createElement('div');
            quote.className = 'quote';
            quote.textContent = config.quotes[Math.floor(Math.random() * config.quotes.length)];
            quote.style.left = `${x - 100}px`;
            quote.style.top = `${y}px`;
            
            gameContainer.appendChild(quote);
            
            // Remove after animation
            setTimeout(() => {
                quote.remove();
            }, 2000);
        }
        
        // Create particles for popped bubble
        function createParticles(bubble) {
            const particleCount = Math.max(5, Math.floor(bubble.size / 10));
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: bubble.x + bubble.size / 2,
                    y: bubble.y + bubble.size / 2,
                    size: randomInt(5, 15),
                    color: bubble.color,
                    vx: randomFloat(-5, 5),
                    vy: randomFloat(-5, 5),
                    life: randomInt(20, 40),
                    element: null
                });
            }
        }
        
        // Update particles
        function updateParticles() {
            // Clear existing particles
            document.querySelectorAll('.particle').forEach(el => el.remove());
            
            // Update and render particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                // Update position
                p.x += p.vx;
                p.y += p.vy;
                
                // Apply gravity
                p.vy += 0.1;
                
                // Decrease life
                p.life--;
                
                // Remove dead particles
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                // Create and position particle element
                const particleEl = document.createElement('div');
                particleEl.className = 'particle';
                particleEl.style.width = `${p.size}px`;
                particleEl.style.height = `${p.size}px`;
                particleEl.style.left = `${p.x}px`;
                particleEl.style.top = `${p.y}px`;
                particleEl.style.backgroundColor = p.color;
                particleEl.style.opacity = p.life / 40;
                
                gameContainer.appendChild(particleEl);
            }
        }
        
        // Update timer
        function updateTimer() {
            timeLeft--;
            timeDisplay.textContent = `Time: ${timeLeft}`;
            
            if (timeLeft <= 0) {
                endGame();
            }
        }
        
        // Touch event handlers
        function handleTouchStart(e) {
            if (!gameActive) return;
            
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = false;
        }
        
        function handleTouchMove(e) {
            if (!gameActive) return;
            
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            
            // Check if this is a swipe (movement exceeds threshold)
            if (Math.abs(dx) > config.swipeThreshold || Math.abs(dy) > config.swipeThreshold) {
                isSwiping = true;
                
                // Find bubble at touch start position
                const bubble = getBubbleAtPosition(touchStartX, touchStartY);
                if (bubble) {
                    // Apply force to bubble
                    bubble.vx = dx * 0.1;
                    bubble.vy = dy * 0.1;
                }
            }
        }
        
        function handleTouchEnd() {
            isSwiping = false;
        }
        
        // Mouse event handlers (for desktop)
        function handleMouseDown(e) {
            if (!gameActive) return;
            
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            isSwiping = false;
        }
        
        function handleMouseMove(e) {
            if (!gameActive) return;
            
            const dx = e.clientX - touchStartX;
            const dy = e.clientY - touchStartY;
            
            // Check if this is a swipe (movement exceeds threshold)
            if (Math.abs(dx) > config.swipeThreshold || Math.abs(dy) > config.swipeThreshold) {
                isSwiping = true;
                
                // Find bubble at mouse down position
                const bubble = getBubbleAtPosition(touchStartX, touchStartY);
                if (bubble) {
                    // Apply force to bubble
                    bubble.vx = dx * 0.1;
                    bubble.vy = dy * 0.1;
                }
            }
        }
        
        function handleMouseUp() {
            isSwiping = false;
        }
        
        // Get bubble at specific position
        function getBubbleAtPosition(x, y) {
            for (const bubble of bubbles) {
                const centerX = bubble.x + bubble.size / 2;
                const centerY = bubble.y + bubble.size / 2;
                const distance = Math.sqrt(
                    Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2)
                );
                
                if (distance <= bubble.size / 2) {
                    return bubble;
                }
            }
            return null;
        }
        
        // Utility functions
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        function randomFloat(min, max) {
            return Math.random() * (max - min) + min;
        }
        
        // Initialize game when loaded
        window.addEventListener('load', init);
    </script>
</body>
</html>
